<!doctype html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;font-family:Onest,system-ui,sans-serif;background:#D9BF94;color:#1E2422;overflow:hidden}
.up{background:#2E3833;color:#EFE8DC;padding:20px 20px 28px;height:520px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.top b{font-weight:600}
h1{margin-top:auto;font-size:40px;line-height:1.04;font-weight:500;letter-spacing:-.02em}
.sub{margin-top:14px;font-size:16px;line-height:1.45;color:#BFC6BE}
.rail{position:relative;margin:0 20px;height:92px;border-top:1px solid #9AA0A0;border-bottom:1px solid #9AA0A0;margin-top:34px}
.seg{position:absolute;top:-6px;height:11px}.y{left:0;width:20%;background:#E4B53A}.r{left:20%;width:50%;background:#C4452F}.b{left:70%;width:30%;background:#3B6CAE}
.lab{position:absolute;top:18px;font-size:13px;font-variant-numeric:tabular-nums}
.car{position:absolute;left:28%;top:30px;width:132px;height:52px;background:#2E3833;color:#EFE8DC;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.bar{position:absolute;bottom:0;left:0;right:0;height:72px;background:#1E2422;color:#EFE8DC;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.bar .p{font-size:28px;font-weight:500}.bar .c{border:1px solid #EFE8DC;padding:14px 18px;font-size:14px;letter-spacing:.08em}
.fact{margin:22px 20px;font-size:15px;line-height:1.5}
</style><body>
<div class="up"><div class="top"><b>MOVA</b><span>RU / EN</span></div>
<h1>Первые шаги к ровной осанке</h1>
<p class="sub">3 урока, которые можно повторять дома. Лёгкость в теле уже после первого.</p></div>
<div class="rail"><span class="seg y"></span><span class="seg r"></span><span class="seg b"></span>
<span class="lab" style="left:0">01 · 10</span><span class="lab" style="left:20%">02 · 25 мин</span><span class="lab" style="left:72%">03 · 15</span>
<div class="car">50 МИНУТ</div></div>
<p class="fact">Мобильность → самокоррекция → закрепление под нагрузкой. Пружины лёгкая, средняя, тяжёлая.</p>
<div class="bar"><span class="p">€9</span><span class="c">КУПИТЬ УРОКИ</span></div>
</body></html>
