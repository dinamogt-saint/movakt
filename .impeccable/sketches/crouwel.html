<!doctype html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;font-family:Onest,system-ui,sans-serif;background:#F2F2EE;color:#141414;overflow:hidden;
background-image:linear-gradient(#C9D3E6 1px,transparent 1px),linear-gradient(90deg,#C9D3E6 1px,transparent 1px);background-size:39px 39px}
.top{display:flex;justify-content:space-between;padding:16px 20px;font-size:13px;letter-spacing:.14em}
.plumb{position:absolute;left:195px;top:0;bottom:0;width:2px;background:#2340D6}
.num{display:flex;gap:0;margin:40px 0 0 0}.num div{width:130px;height:234px;border-right:1px solid #141414;font-size:150px;font-weight:300;line-height:234px;text-align:center;font-variant-numeric:tabular-nums}
h1{margin:30px 20px 0;font-size:36px;line-height:1.05;font-weight:600;letter-spacing:-.02em;background:#F2F2EE;position:relative}
.acc{position:absolute;bottom:0;left:0;right:0;height:156px;background:#2340D6;color:#fff;padding:24px 20px}
.acc p{font-size:15px;opacity:.85}.acc b{display:block;font-size:44px;font-weight:500;margin-top:6px}
</style><body><div class="plumb"></div>
<div class="top"><b>MOVA</b><span>RU / EN</span></div>
<div class="num"><div>01</div><div>02</div><div style="border:0">03</div></div>
<h1>Первые шаги к ровной осанке</h1>
<div class="acc"><p>3 урока · 50 минут · навсегда</p><b>€9 → Купить</b></div>
</body></html>
